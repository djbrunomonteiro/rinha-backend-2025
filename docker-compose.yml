version: '3.8'

services:
  db:
    image: postgres:17-alpine
    networks:
      - backend
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 3s
      retries: 11
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "120MB"

  health:
    build:
      context: .
    command: ["node", "./dist/workers/health.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - payment-processor
    environment:
      - PAYMENT_PROCESSOR_URL_DEFAULT=http://payment-processor-default:8080
      - PAYMENT_PROCESSOR_URL_FALLBACK=http://payment-processor-fallback:8080

  app1:
    build: .
    hostname: app1
    depends_on:
      db:
        condition: service_healthy
      health:
        condition: service_started
    networks:
      - backend
      - payment-processor
    environment:
      - PAYMENT_PROCESSOR_URL_DEFAULT=http://payment-processor-default:8080
      - PAYMENT_PROCESSOR_URL_FALLBACK=http://payment-processor-fallback:8080
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "100mb"

  app2:
    build: .
    hostname: app2
    depends_on:
      db:
        condition: service_healthy
      health:
        condition: service_started
    networks:
      - backend
      - payment-processor
    environment:
      - PAYMENT_PROCESSOR_URL_DEFAULT=http://payment-processor-default:8080
      - PAYMENT_PROCESSOR_URL_FALLBACK=http://payment-processor-fallback:8080
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "100mb"

  load-balancer:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "9999:9999"
    networks:
      - backend
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "25MB"

networks:
  backend:
    driver: bridge

  payment-processor:
    external: true
